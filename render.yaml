# LEGACY: Render ya no es la infraestructura de despliegue de PAMPA.
# La arquitectura de producción definitiva es Vercel (frontend) + Railway
# (backend API + PostgreSQL). Este archivo se conserva como referencia
# histórica y no debe usarse para desplegar.
services:
  - type: web
    name: pampa-api
    runtime: node
    plan: free
    rootDir: pampa-api
    buildCommand: npm ci && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ENABLE_SWAGGER
        value: "false"
